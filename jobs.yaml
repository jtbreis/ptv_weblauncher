  - id: box_relaxed_tracking
    name: Box Relaxed Tracking
    requires_docker: false
    description: >
      Set initial tracking parameters, then progressively relax box_size_track. At the
      tightest hop limit, detect the velocity histogram peak per block and gate to
      peak ± σ; each relax pass widens the velocity window and increases hop limit.
    script: ./ptv_weblauncher/run_box_relaxed_tracking.sh
    args: []
    env:
      - name: OUTPUT_DIR
        label: Output Host Directory
        default: /mnt/ssd
        required: true
      - name: OUTPUT_BASE
        label: Output Base Path
        default: data/Windtunnel_PTV_TNTI/X300cm_PTV_above_TNTI
      - name: CASE
        label: Case
        default: TNTI_opposing_gravity
      - name: RUNS
        label: Runs (comma-separated)
        default: Run1
      - name: STM_FILENAME
        label: STM input filename
        default: rays_out_cpp.h5
      - name: MAX_STEREO_ERROR
        label: "Initial tracking: STM error ceiling"
        default: "0.1"
        help: "Only particles with stereomatching error <= this value enter the pool."
      - name: BOX_SIZE_INITIAL_X_LO
        label: "Initial tracking: search box X low (mm)"
        default: "0.0"
      - name: BOX_SIZE_INITIAL_X_HI
        label: "Initial tracking: search box X high (mm)"
        default: "3.5"
      - name: BOX_SIZE_Y
        label: "Initial tracking: search box Y half-width (mm)"
        default: "1.5"
      - name: BOX_SIZE_Z
        label: "Initial tracking: search box Z half-width (mm)"
        default: "1.5"
      - name: MAX_BRANCH
        label: "Initial tracking: max branch"
        default: "30"
      - name: MAX_SEEDS
        label: "Initial tracking: max seeds (0 = all)"
        default: "0"
      - name: MIN_TRACK_LENGTH
        label: "Initial tracking: min track length"
        default: "3"
      - name: USE_BIDIRECTIONAL_GRAPH
        label: Bidirectional graph
        type: checkbox
        default: false
      - name: NO_3_FRAME
        label: 4-frame tracks only
        type: checkbox
        default: false
      - name: BOX_SIZE_MIN
        label: "Relaxation: initial hop limit (mm)"
        default: "0.15"
        help: "Tightest box_size_track; seed pass and dominant-bin reference."
      - name: BOX_SIZE_MAX
        label: "Relaxation: max hop limit (mm)"
        default: "0.5"
        help: "Loosest hop limit in the sweep; also used when building the candidate graph."
      - name: BOX_SIZE_STEP
        label: "Relaxation: hop step (mm)"
        default: "0.05"
      - name: VELOCITY_VARIABLE
        label: "Dominant bin: velocity variable"
        default: vx
        help: "Histogram axis for finding the busiest bin at the initial hop limit."
      - name: VELOCITY_TARGET
        label: "Peak override (optional)"
        default: ""
        help: "Fixed velocity peak. Leave empty to auto-detect from histogram at tight box."
      - name: VELOCITY_SIGMA
        label: "Velocity σ (fixed)"
        default: "1.0"
        help: "Half-width around detected peak; same for all runs. Seed pass uses ±1σ."
      - name: VELOCITY_BIN_COUNT
        label: "Peak histogram bins"
        default: "0"
        help: "Coarseness for peak detection at initial hop (0 = auto)."
      - name: VELOCITY_BAND_MARGIN
        label: "Max velocity window multiplier"
        default: "2.0"
        help: "Widen acceptance to this many × σ by the last relax pass (seed = 1×σ)."
      - name: DT
        label: DT (s)
        default: "1e-3"
      - name: WORKERS
        label: Workers
        default: "4"
      - name: MAX_BLOCKS
        label: Max 4-Frame Blocks (smoke test)
        default: ""


  - id: combine_tracks_parquet
    name: Combine Tracks → Parquet
    requires_docker: false
    description: >
      Combine selected runs' track .h5part files into one Parquet table for post-processing.
      Choose the tracks filename (4-frame, graph, staging, PDF/box relaxed, etc.) and which
      Run folders to include. Empty RUNS discovers all Run* dirs that contain that file.
      Writes {CASE}/{CASE}_{tracks_stem}.parquet (or OUTPUT_NAME) under the case folder.
    script: ./ptv_weblauncher/run_combine_tracks_parquet.sh
    args: []
    env:
      - name: OUTPUT_DIR
        label: Output Host Directory
        default: /mnt/ssd
        required: true
        help: "Host path for data/ (mounted read-write)."
      - name: OUTPUT_BASE
        label: Output Base Path
        default: data/Windtunnel_PTV_TNTI/X300cm_PTV_above_TNTI
        placeholder: data/Windtunnel_PTV_TNTI/X300cm_PTV_above_TNTI
        help: "Path under Output Host Directory to the parent of {CASE}."
      - name: CASE
        label: Case
        default: TNTI_opposing_gravity
        required: true
      - name: RUNS
        label: Runs (comma-separated)
        default: Run1
        placeholder: e.g. Run1,Run2 (leave empty for all with tracks file)
        help: "Which Run folders to combine. Leave empty to auto-detect all Run* that contain TRACKS_NAME."
      - name: TRACKS_NAME
        label: Tracks file
        type: select
        default: tracks.h5part
        options:
          - tracks.h5part
          - tracks_staging.h5part
          - tracks_graph.h5part
          - tracks_graph_staging.h5part
          - tracks_pdf_relaxed.h5part
          - tracks_box_relaxed.h5part
        help: "Filename inside each {CASE}/{Run}/ directory to combine."
      - name: OUTPUT_NAME
        label: Output Parquet filename (optional)
        default: ""
        placeholder: e.g. TNTI_opposing_gravity_tracks.parquet
        help: "Written under the case folder. Empty → {CASE}_{tracks_stem}.parquet."
      - name: WORKERS
        label: Parallel run loaders
        default: "8"
