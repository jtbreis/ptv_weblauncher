{% extends "base.html" %}
{% block title %}Run history — Job Launcher{% endblock %}
{% block body %}
<main class="main" style="max-width:1200px;margin:0 auto;width:100%">
  <div class="content">
    <h1 class="page-title">Run history</h1>
    <p class="page-desc">Completed and failed runs (newest first), including parameters used. Stored under <code>{{ run_history_path }}</code>.</p>
    <div class="table-wrap">
      <table class="data-table" id="hist-table">
        <thead>
          <tr>
            <th>Finished</th>
            <th>Job</th>
            <th>Case</th>
            <th>Base path</th>
            <th>Status</th>
            <th>Duration</th>
            <th>Exit</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="hist-body">
          <tr><td colspan="9" style="color:var(--text3)">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script>
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}
function runCase(r) {
  return (r.case || (r.env && r.env.CASE) || '').trim();
}
function runBasePath(r) {
  const e = r.env || {};
  return (r.base_path || e.OUTPUT_BASE || e.INPUT_BASE || '').trim();
}
async function deleteRun(runId, btn) {
  const label = runId.slice(0, 8);
  if (!confirm('Remove this run from history? (' + label + '…)')) return;
  if (btn) btn.disabled = true;
  try {
    const res = await fetch('/api/history/' + encodeURIComponent(runId), { method: 'DELETE' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Delete failed');
    load();
  } catch (e) {
    alert(e.message);
    if (btn) btn.disabled = false;
  }
}

async function load() {
  const res = await fetch('/api/history');
  const data = await res.json();
  const items = data.items || [];
  const tb = document.getElementById('hist-body');
  if (!items.length) {
    tb.innerHTML = '<tr><td colspan="9" style="color:var(--text3)">No recorded runs yet.</td></tr>';
    return;
  }
  tb.innerHTML = items.map(r => {
    const caseName = runCase(r);
    const basePath = runBasePath(r);
    return `
    <tr>
      <td style="font-family:var(--mono);font-size:11px">${esc(r.finished_at || r.started_at || '')}</td>
      <td>${esc(r.job_name || '')}<div style="font-size:11px;color:var(--text3);margin-top:4px">${esc(r.job_id || '')}</div></td>
      <td>${caseName ? esc(caseName) : '<span style="color:var(--text3)">—</span>'}</td>
      <td style="font-family:var(--mono);font-size:11px;max-width:280px;word-break:break-all">${basePath ? esc(basePath) : '<span style="color:var(--text3)">—</span>'}</td>
      <td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td>
      <td style="font-family:var(--mono)">${r.duration != null ? esc(String(r.duration)) + 's' : '—'}</td>
      <td style="font-family:var(--mono)">${r.exit_code != null ? esc(String(r.exit_code)) : '—'}</td>
      <td><a href="/runs/${encodeURIComponent(r.run_id)}">Open / Re-run</a></td>
      <td><button type="button" class="btn-danger hist-del-btn" data-run-id="${esc(r.run_id)}">Delete</button></td>
    </tr>
  `;
  }).join('');
  tb.querySelectorAll('.hist-del-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteRun(btn.getAttribute('data-run-id'), btn));
  });
}
load();
setInterval(load, 8000);
</script>
{% endblock %}
