<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Job Launcher{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --bg2: #141614;
    --bg3: #1a1d1a;
    --border: #2a2e2a;
    --border2: #3a3e3a;
    --accent: #00ff88;
    --accent2: #00cc6a;
    --danger: #ff4444;
    --warn: #ffaa00;
    --text: #d4d8d4;
    --text2: #8a8e8a;
    --text3: #5a5e5a;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

  .top-nav {
    display: flex; align-items: center; gap: 8px; padding: 10px 20px;
    background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .top-nav a {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text2); text-decoration: none; padding: 6px 12px; border-radius: 2px; border: 1px solid transparent;
  }
  .top-nav a:hover { color: var(--accent); border-color: var(--border2); }
  .top-nav a.active { color: var(--accent); border-color: #004433; background: #001a12; }

  .app { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 44px); }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 0; display: flex; flex-direction: column; }
  .main { display: flex; flex-direction: column; overflow: hidden; }

  .sidebar-header { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-header .logo { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
  .sidebar-header h1 { font-size: 16px; font-weight: 500; color: var(--text); letter-spacing: -0.01em; }

  .job-list { flex: 1; padding: 12px 0; overflow-y: auto; }
  .job-item { padding: 10px 20px; cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s; }
  .job-item:hover { background: var(--bg3); }
  .job-item.active { border-left-color: var(--accent); background: var(--bg3); }
  .job-item .job-item-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .job-item .job-item-id { font-family: var(--mono); font-size: 10px; color: var(--text3); }

  .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
  .runs-toggle { font-family: var(--mono); font-size: 11px; color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 8px; letter-spacing: 0.05em; text-transform: uppercase; }
  .runs-toggle:hover { color: var(--accent); }
  .run-count { background: var(--bg3); border: 1px solid var(--border2); border-radius: 3px; padding: 1px 6px; font-size: 10px; }

  .main-header { padding: 24px 32px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; }
  .job-title { font-size: 20px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 4px; }
  .job-desc { font-size: 13px; color: var(--text2); }
  .launch-btn, .btn-primary {
    background: var(--accent); color: #000; border: none; padding: 10px 24px; font-family: var(--mono); font-size: 12px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.15s; white-space: nowrap;
  }
  .launch-btn:hover, .btn-primary:hover { background: var(--accent2); }
  .launch-btn:disabled { background: var(--bg3); color: var(--text3); cursor: not-allowed; border: 1px solid var(--border); }
  .btn-secondary {
    background: transparent; color: var(--text2); border: 1px solid var(--border2); padding: 8px 16px; font-family: var(--mono); font-size: 11px;
    cursor: pointer; border-radius: 2px; text-decoration: none; display: inline-block;
  }
  .btn-secondary:hover { color: var(--accent); border-color: var(--accent); }

  .content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .page-title { font-size: 22px; font-weight: 300; margin-bottom: 8px; }
  .page-desc { color: var(--text2); font-size: 13px; margin-bottom: 24px; }

  .form-section { margin-bottom: 32px; }
  .form-section-title { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .form-section-desc { color: var(--text2); font-size: 12px; line-height: 1.5; margin: 0 0 14px; max-width: 72ch; }
  .env-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .env-field { display: flex; flex-direction: column; gap: 5px; }
  .env-field.full { grid-column: 1 / -1; }
  .env-label { font-family: var(--mono); font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .env-var-name { color: var(--text3); font-size: 10px; }
  .env-field input, .env-field textarea, .env-field select {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 8px 10px; border-radius: 2px; outline: none; transition: border-color 0.1s;
  }
  .env-field input:focus, .env-field textarea:focus, .env-field select:focus { border-color: var(--accent); }
  .env-field-help { font-size: 11px; color: var(--text3); line-height: 1.45; margin-top: 2px; }
  .env-field-help.prominent { color: var(--text2); font-size: 12px; margin-bottom: 10px; }
  .per-camera-panel {
    border: 1px solid var(--border2); border-radius: 3px; background: var(--bg2);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .per-camera-panel-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .per-camera-panel-sub { font-size: 12px; color: var(--text2); line-height: 1.45; }
  .per-camera-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .per-camera-actions-label { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 4px; }
  .per-camera-btn {
    background: var(--bg3); border: 1px solid var(--border2); color: var(--text2);
    font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 2px; cursor: pointer;
  }
  .per-camera-btn:hover { color: var(--accent); border-color: var(--accent); }
  .per-camera-preview {
    font-family: var(--mono); font-size: 11px; color: var(--text3); padding-top: 10px;
    border-top: 1px solid var(--border); margin-top: 2px;
  }
  .per-camera-preview-title { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .per-camera-preview strong { color: var(--accent); font-weight: 500; }
  .per-camera-map { display: flex; flex-wrap: wrap; gap: 8px; }
  .per-camera-map-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 3px;
    border: 1px solid var(--border2); background: var(--bg3); font-family: var(--mono); font-size: 11px;
  }
  .per-camera-map-item .cam-label { color: var(--text2); min-width: 52px; }
  .per-camera-map-item .cam-arrow { color: var(--text3); }
  .per-camera-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .per-camera-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .camera-th-card {
    border: 1px solid var(--border2); border-radius: 4px; background: var(--bg3);
    padding: 12px; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.15s, background 0.15s;
  }
  .camera-th-card.is-th1 { border-color: #2a6655; background: #0f1f18; }
  .camera-th-card.is-th2 { border-color: #66552a; background: #1f1a0f; }
  .camera-th-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .camera-th-name { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.02em; }
  .camera-th-badge {
    font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    letter-spacing: 0.06em; white-space: nowrap;
  }
  .camera-th-card.is-th1 .camera-th-badge { background: #003322; color: #66ffaa; border: 1px solid #006644; }
  .camera-th-card.is-th2 .camera-th-badge { background: #332200; color: #ffcc66; border: 1px solid #664400; }
  .camera-th-folder { font-family: var(--mono); font-size: 10px; color: var(--text3); line-height: 1.4; }
  .camera-th-card.is-th1 .camera-th-folder { color: #7ab89a; }
  .camera-th-card.is-th2 .camera-th-folder { color: #b8a87a; }
  .camera-th-card select { width: 100%; margin-top: 2px; }
  .checkbox-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .checkbox-row label { cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--text); }
  .required-dot { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; display: inline-block; }
  .env-field textarea { min-height: 72px; resize: vertical; }

  .log-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .log-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .log-title { font-family: var(--mono); font-size: 11px; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .log-body { font-family: var(--mono); font-size: 11px; line-height: 1.7; padding: 12px 14px; max-height: 380px; overflow-y: auto; color: #a0c8a0; white-space: pre-wrap; word-break: break-all; }
  .log-body:empty::before { content: "Waiting for output..."; color: var(--text3); font-style: italic; }
  .log-clear { font-family: var(--mono); font-size: 10px; color: var(--text3); cursor: pointer; background: none; border: none; padding: 0; letter-spacing: 0.05em; }
  .log-clear:hover { color: var(--text2); }

  .badge { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 2px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
  .badge.running { background: #003322; color: var(--accent); border: 1px solid #004433; }
  .badge.done { background: #003322; color: var(--accent); border: 1px solid #004433; }
  .badge.failed { background: #330000; color: var(--danger); border: 1px solid #440000; }
  .badge.cancelled { background: #332200; color: var(--warn); border: 1px solid #443300; }
  .badge.pending { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
  .btn-danger {
    background: transparent; color: var(--danger); border: 1px solid #662222; padding: 8px 16px;
    font-family: var(--mono); font-size: 11px; cursor: pointer; border-radius: 2px;
  }
  .btn-danger:hover { background: #330000; color: #ff6666; }
  .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .runs-panel { display: none; position: fixed; right: 0; top: 44px; bottom: 0; width: 380px; background: var(--bg2); border-left: 1px solid var(--border); z-index: 100; flex-direction: column; }
  .runs-panel.open { display: flex; }
  .runs-panel-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .runs-panel-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); }
  .close-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; line-height: 1; }
  .close-btn:hover { color: var(--text); }
  .runs-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .run-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; cursor: pointer; transition: border-color 0.1s; }
  .run-card:hover { border-color: var(--border2); }
  .run-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .run-card-name { font-size: 13px; font-weight: 500; }
  .run-card-meta { font-family: var(--mono); font-size: 10px; color: var(--text3); }
  .runs-empty { text-align: center; padding: 40px 20px; font-family: var(--mono); font-size: 11px; color: var(--text3); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 3px; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  table.data-table th { font-family: var(--mono); font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; background: var(--bg2); }
  table.data-table tr:hover td { background: var(--bg3); }
  table.data-table a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 11px; }
  table.data-table a:hover { text-decoration: underline; }

  .param-grid { display: grid; grid-template-columns: 220px 1fr; gap: 8px 16px; font-size: 13px; max-width: 900px; }
  .param-grid dt { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .param-grid dd { font-family: var(--mono); color: var(--text); word-break: break-all; margin: 0; }

  .actions-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 20px; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<nav class="top-nav">
  <a href="{{ url_for('index') }}" class="{% if nav_active == 'data_runs' %}active{% endif %}">Case status</a>
  <a href="{{ url_for('launch_page') }}" class="{% if nav_active == 'launch' %}active{% endif %}">Launch</a>
  <a href="{{ url_for('queue_page') }}" class="{% if nav_active == 'queue' %}active{% endif %}">Queue</a>
  <a href="{{ url_for('running_page') }}" class="{% if nav_active == 'running' %}active{% endif %}">Running</a>
  <a href="{{ url_for('history_page') }}" class="{% if nav_active == 'history' %}active{% endif %}">History</a>
  <a href="{{ url_for('pdf_tracking_page') }}" class="{% if nav_active == 'pdf_tracking' %}active{% endif %}">PDF tracking</a>
  <a href="{{ url_for('error_sensitivity_tracking_page') }}" class="{% if nav_active == 'error_sensitivity' %}active{% endif %}">Error sensitivity</a>
  <a href="{{ url_for('box_size_sensitivity_tracking_page') }}" class="{% if nav_active == 'box_size_sensitivity' %}active{% endif %}">Box size sensitivity</a>
  <a href="{{ url_for('box_relaxed_tracking_page') }}" class="{% if nav_active == 'box_relaxed' %}active{% endif %}">Box relaxed</a>
  <a href="http://127.0.0.1:5001" target="_blank" rel="noopener">Cine preprocessing ↗</a>
</nav>
{% block body %}{% endblock %}
</body>
</html>
