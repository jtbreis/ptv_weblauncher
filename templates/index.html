<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --bg2: #141614;
    --bg3: #1a1d1a;
    --border: #2a2e2a;
    --border2: #3a3e3a;
    --accent: #00ff88;
    --accent2: #00cc6a;
    --danger: #ff4444;
    --warn: #ffaa00;
    --text: #d4d8d4;
    --text2: #8a8e8a;
    --text3: #5a5e5a;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 0; display: flex; flex-direction: column; }
  .main { display: flex; flex-direction: column; overflow: hidden; }

  /* Sidebar header */
  .sidebar-header { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-header .logo { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
  .sidebar-header h1 { font-size: 16px; font-weight: 500; color: var(--text); letter-spacing: -0.01em; }

  /* Job list */
  .job-list { flex: 1; padding: 12px 0; overflow-y: auto; }
  .job-item { padding: 10px 20px; cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s; }
  .job-item:hover { background: var(--bg3); }
  .job-item.active { border-left-color: var(--accent); background: var(--bg3); }
  .job-item .job-item-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .job-item .job-item-id { font-family: var(--mono); font-size: 10px; color: var(--text3); }

  /* Sidebar footer */
  .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
  .runs-toggle { font-family: var(--mono); font-size: 11px; color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 8px; letter-spacing: 0.05em; text-transform: uppercase; }
  .runs-toggle:hover { color: var(--accent); }
  .run-count { background: var(--bg3); border: 1px solid var(--border2); border-radius: 3px; padding: 1px 6px; font-size: 10px; }

  /* Main header */
  .main-header { padding: 24px 32px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; }
  .job-title { font-size: 20px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 4px; }
  .job-desc { font-size: 13px; color: var(--text2); }
  .launch-btn { background: var(--accent); color: #000; border: none; padding: 10px 24px; font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.15s; white-space: nowrap; }
  .launch-btn:hover { background: var(--accent2); }
  .launch-btn:active { transform: scale(0.97); }
  .launch-btn:disabled { background: var(--bg3); color: var(--text3); cursor: not-allowed; border: 1px solid var(--border); }

  /* Content area */
  .content { flex: 1; overflow-y: auto; padding: 24px 32px; }

  /* Env form */
  .form-section { margin-bottom: 32px; }
  .form-section-title { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .env-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .env-field { display: flex; flex-direction: column; gap: 5px; }
  .env-field.full { grid-column: 1 / -1; }
  .env-label { font-family: var(--mono); font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .env-var-name { color: var(--text3); font-size: 10px; }
  .env-field input { background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 8px 10px; border-radius: 2px; outline: none; transition: border-color 0.1s; }
  .env-field input:focus { border-color: var(--accent); }
  .env-field input::placeholder { color: var(--text3); }
  .required-dot { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; display: inline-block; }

  /* Log panel */
  .log-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .log-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .log-title { font-family: var(--mono); font-size: 11px; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .log-body { font-family: var(--mono); font-size: 11px; line-height: 1.7; padding: 12px 14px; max-height: 380px; overflow-y: auto; color: #a0c8a0; white-space: pre-wrap; word-break: break-all; }
  .log-body:empty::before { content: "Waiting for output..."; color: var(--text3); font-style: italic; }
  .log-clear { font-family: var(--mono); font-size: 10px; color: var(--text3); cursor: pointer; background: none; border: none; padding: 0; letter-spacing: 0.05em; }
  .log-clear:hover { color: var(--text2); }

  /* Status badge */
  .badge { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 2px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
  .badge.running { background: #003322; color: var(--accent); border: 1px solid #004433; }
  .badge.done { background: #003322; color: var(--accent); border: 1px solid #004433; }
  .badge.failed { background: #330000; color: var(--danger); border: 1px solid #440000; }
  .badge.pending { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Runs history overlay */
  .runs-panel { display: none; position: fixed; right: 0; top: 0; bottom: 0; width: 380px; background: var(--bg2); border-left: 1px solid var(--border); z-index: 100; flex-direction: column; }
  .runs-panel.open { display: flex; }
  .runs-panel-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .runs-panel-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); }
  .close-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; line-height: 1; }
  .close-btn:hover { color: var(--text); }
  .runs-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .run-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; cursor: pointer; transition: border-color 0.1s; }
  .run-card:hover { border-color: var(--border2); }
  .run-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .run-card-name { font-size: 13px; font-weight: 500; }
  .run-card-meta { font-family: var(--mono); font-size: 10px; color: var(--text3); }
  .runs-empty { text-align: center; padding: 40px 20px; font-family: var(--mono); font-size: 11px; color: var(--text3); }

  /* Empty state */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text3); font-family: var(--mono); font-size: 12px; gap: 8px; }
  .empty-state .big { font-size: 32px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">4D-PTV</div>
      <h1>Job Launcher</h1>
    </div>
    <nav class="job-list" id="job-list">
      {% for job in jobs %}
      <div class="job-item {% if loop.first %}active{% endif %}" data-job-id="{{ job.id }}" onclick="selectJob('{{ job.id }}')">
        <div class="job-item-name">{{ job.name }}</div>
        <div class="job-item-id">{{ job.id }}</div>
      </div>
      {% endfor %}
    </nav>
    <div class="sidebar-footer">
      <div class="runs-toggle" onclick="toggleRuns()">
        <span>Run history</span>
        <span class="run-count" id="run-count">0</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div id="job-view">
      <!-- Populated by JS -->
    </div>
  </main>
</div>

<!-- Runs panel -->
<div class="runs-panel" id="runs-panel">
  <div class="runs-panel-header">
    <span class="runs-panel-title">Run History</span>
    <button class="close-btn" onclick="toggleRuns()">×</button>
  </div>
  <div class="runs-list" id="runs-list">
    <div class="runs-empty">No runs yet.</div>
  </div>
</div>

<script>
const JOBS = {{ jobs | tojson }};
let currentJobId = JOBS[0]?.id || null;
let activeRunId = null;
let logSource = null;
let allRuns = {};

function selectJob(jobId) {
  currentJobId = jobId;
  document.querySelectorAll('.job-item').forEach(el => {
    el.classList.toggle('active', el.dataset.jobId === jobId);
  });
  renderJobView();
}

function renderJobView() {
  const job = JOBS.find(j => j.id === currentJobId);
  if (!job) return;
  const view = document.getElementById('job-view');
  view.innerHTML = `
    <div class="main-header">
      <div>
        <div class="job-title">${job.name}</div>
        <div class="job-desc">${job.description || ''}</div>
      </div>
      <button class="launch-btn" id="launch-btn" onclick="launchJob()">▶ Launch</button>
    </div>
    <div class="content">
      <div class="form-section">
        <div class="form-section-title">Environment Variables</div>
        <div class="env-grid" id="env-grid">
          ${(job.env || []).map(e => `
            <div class="env-field${e.name === 'OUTPUT_DIR' ? ' full' : ''}">
              <label class="env-label">
                ${e.required ? '<span class="required-dot"></span>' : ''}
                ${e.label}
                <span class="env-var-name">${e.name}</span>
              </label>
              <input
                id="env-${e.name}"
                value="${e.default || ''}"
                placeholder="${e.placeholder || e.default || ''}"
                data-required="${e.required || false}"
              />
            </div>
          `).join('')}
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Output <span id="log-status"></span></div>
        <div class="log-panel">
          <div class="log-header">
            <span class="log-title">
              <span id="log-badge" class="badge pending">idle</span>
              <span id="log-run-id" style="color:var(--text3);font-size:10px;"></span>
            </span>
            <button class="log-clear" onclick="clearLog()">clear</button>
          </div>
          <div class="log-body" id="log-body"></div>
        </div>
      </div>
    </div>
  `;
}

function getEnvVars() {
  const job = JOBS.find(j => j.id === currentJobId);
  const env = {};
  (job.env || []).forEach(e => {
    const val = document.getElementById('env-' + e.name)?.value || '';
    if (val) env[e.name] = val;
  });
  return env;
}

async function launchJob() {
  if (logSource) { logSource.close(); logSource = null; }

  const btn = document.getElementById('launch-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Launching...';
  setLogBadge('pending', 'launching');
  clearLog();

  try {
    const res = await fetch('/api/launch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: currentJobId, env: getEnvVars() })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Server error');

    activeRunId = data.run_id;
    document.getElementById('log-run-id').textContent = data.run_id.slice(0, 8);
    setLogBadge('running', 'running');
    btn.textContent = '⏳ Running...';
    streamLogs(data.run_id);
    pollStatus(data.run_id);
    refreshRuns();
  } catch(e) {
    setLogBadge('failed', 'error');
    appendLog('ERROR: ' + e.message);
    btn.disabled = false;
    btn.textContent = '▶ Launch';
  }
}

function streamLogs(runId) {
  const body = document.getElementById('log-body');
  logSource = new EventSource(`/api/runs/${runId}/logs`);
  logSource.onmessage = e => {
    if (e.data.startsWith('[FINISHED')) {
      logSource.close();
      return;
    }
    appendLog(e.data);
  };
  logSource.onerror = () => logSource.close();
}

function appendLog(line) {
  const body = document.getElementById('log-body');
  if (!body) return;
  body.textContent += line + '\n';
  body.scrollTop = body.scrollHeight;
}

function clearLog() {
  const body = document.getElementById('log-body');
  if (body) body.textContent = '';
}

function setLogBadge(cls, text) {
  const b = document.getElementById('log-badge');
  if (!b) return;
  b.className = 'badge ' + cls;
  b.textContent = text;
  b.classList.toggle('pulse', cls === 'running');
}

async function pollStatus(runId) {
  const res = await fetch(`/api/runs/${runId}`);
  const data = await res.json();
  if (data.status === 'running' || data.status === 'pending') {
    setTimeout(() => pollStatus(runId), 1500);
    return;
  }
  // Finished
  const btn = document.getElementById('launch-btn');
  if (btn) { btn.disabled = false; btn.textContent = '▶ Launch'; }
  setLogBadge(data.status, data.status === 'done' ? `done · ${data.duration}s` : `failed · exit ${data.exit_code}`);
  refreshRuns();
}

function toggleRuns() {
  document.getElementById('runs-panel').classList.toggle('open');
  refreshRuns();
}

async function refreshRuns() {
  const res = await fetch('/api/runs');
  allRuns = await res.json();
  const count = Object.keys(allRuns).length;
  document.getElementById('run-count').textContent = count;

  const list = document.getElementById('runs-list');
  if (!count) { list.innerHTML = '<div class="runs-empty">No runs yet.</div>'; return; }

  list.innerHTML = Object.entries(allRuns).reverse().map(([id, r]) => `
    <div class="run-card">
      <div class="run-card-header">
        <span class="run-card-name">${r.job_name}</span>
        <span class="badge ${r.status}">${r.status}</span>
      </div>
      <div class="run-card-meta">${r.started_at}${r.duration ? ' · ' + r.duration + 's' : ''}</div>
    </div>
  `).join('');
}

// Init
renderJobView();
setInterval(refreshRuns, 5000);
</script>
</body>
</html>
